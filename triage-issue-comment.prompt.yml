model: openai/gpt-4.1

messages:

  - role: system
    content: |
      You are a technical triage lead for @{{owner}}.
      Your goal is to analyse the provided data sources to determine their relevance to a new GitHub issue.
      Use British English.

  - role: user
    content: | # markdown
      A GitHub Issue has been raised and a range of dynamic Data Sources have been collected to help triage it. Analyse the information provided to determine:

      1. The nature of the Issue (where multiple apply, select the first applicable from this list):
         - `bug report` if the Issue is reporting a bug or unexpected behaviour
         - `feature request` if the Issue is requesting a new feature or enhancement
         - `other support` if the Issue is seeking other help or guidance

      2. The release version to which the Issue relates; in `v1.2.3` format if specified and identified reliably, otherwise a zero-length string

      3. For each of the provided Data Sources, assess its relevance to the Issue:
         - Use the same `name` as provided to identify each source
         - If an `instruction` has been provided for the source, follow it carefully
         - Provide an overall relevance assessment:
           - `relevant` if the source is likely to help resolve the Issue, e.g. indicating an external cause or providing necessary context
           - `somewhat relevant` if it is partially helpful but not definitive, e.g. showing errors that are not obviously related to the Issue
           - `not relevant` if it does not help address the Issue, e.g. showing normal operation or unrelated information
         - Provide a brief explanation of the data provided and the assessment (1-2 sentences, clean prose without any Markdown special characters or links), e.g.:
           - "Automated tests are passing, indicating no obvious bugs in the codebase and API responses are normal"
           - "Changelog for upstream API shows additions for this appliance type, but not obviously related to the reported issue"
           - "Recent upstream API errors (over last 2 hours) match the timestamps of the reported issue, indicating a likely correlation"

      Provide the results in JSON format.

      # Issue

      ```json
      {{context}}
      ```

      # Data Sources

      ```json
      {{data}}
      ```

responseFormat: json_schema

jsonSchema: |- # json
  {
    "name": "analysis",
    "type": "object",
    "properties": {
      "issue_nature": {
        "type": "string",
        "description": "The category of issue",
        "enum": [
          "bug report",
          "feature request",
          "other support"
        ]
      },
      "release_version": {
        "type": "string",
        "description": "The category of issue",
        "pattern": "^(v\\d+\\.\\d+\\.\\d+|)$"
      },
      "data_sources": {
        "type": "array",
        "description": "List of data sources",
        "items": {
          "type": "object",
          "properties": {
            "name": {
              "type": "string",
              "description": "Name of the data source (identical to the input)"
            },
            "relevance": {
              "enum": [
                "relevant",
                "somewhat relevant",
                "not relevant"
              ],
              "type": "string",
              "description": "Relevance of this data source to the issue"
            },
            "explanation": {
              "type": "string",
              "description": "Explanation of the data source's relevance to the issue"
            }
          },
          "additionalProperties": false,
          "required": [
            "name",
            "relevance",
            "explanation"
          ]
        },
        "minItems": 1
      }
    },
    "additionalProperties": false,
    "required": [
      "issue_nature",
      "release_version",
      "data_sources"
    ]
  }