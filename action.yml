name: Triage Issue Comment
author: Alexander Thoukydides
description: Use AI to assess dynamic data sources for their relevance to an issue and post a new comment
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  gemini_api_key:
    description: The Google AI Studio Gemini API key
    required: true
    type: string
  issue_number:
    description: The GitHub issue to analyse
    type: number
    required: true
  needs:
    description: JSON data structure with the same shape as the GitHub Actions 'needs' context, with one job per data source
    type: string
    required: true
  prompt_file:
    description: Path to a custom .prompt.yml file containing the AI prompt template
    type: string
  prompt_vars:
    description: Additional template variables in YAML format to substitute into the AI prompt
    type: string
    default: ''
  input_prompt_tokens:
    description: The number of input tokens reserved for the prompt template itself (deducted from input_tokens when truncating the issue)
    type: number
    default: 1200 # Measured using https://aistudio.google.com/prompts/new_chat
  input_sources_tokens:
    description: The maximum number of input tokens to use for the data sources in the AI model's input (used to guide truncation of their values to fit the available context)
    type: number
    default: 30000
  dry_run:
    description: Disables actions that modify the issue (adding the comment and minimising previous comments) for testing
    type: boolean
    required: false

runs:
  using: composite

  steps:
    - name: Pre-process the data sources for LLM input context
      id: context
      uses: actions/github-script@v7
      env:
        INPUT_NEEDS:                ${{ inputs.needs }}
        INPUT_INPUT_SOURCES_TOKENS: ${{ inputs.input_sources_tokens }}
        INPUT_INPUT_PROMPT_TOKENS:  ${{ inputs.input_prompt_tokens }}
      with:
        script: | # javascript
          const { default: fn } = await import('${{ github.action_path }}/dist/pre.js');
          return await fn(github);

    - name: Analyse the data sources and issue
      id: analyse
      uses: thoukydides/action-issue-ai-summary@v1
      with:
        gemini_api_key: ${{ inputs.gemini_api_key }}
        issue_number: ${{ inputs.issue_number }}
        prompt_file: ${{ inputs.prompt_file || format('{0}/triage-issue-comment.prompt.yml', github.action_path) }}
        input_prompt_tokens: ${{ steps.context.outputs.prompt_tokens }}
        prompt_vars: |
          data: >-
            ${{ steps.context.outputs.result }}
          ${{ inputs.prompt_vars }}

    - name: Post-process the LLM output to prepare a comment
      id: comment
      uses: actions/github-script@v7
      env:
        INPUT_NEEDS:    ${{ inputs.needs }}
        ANALYSIS:       ${{ steps.analyse.outputs.response }}
      with:
        result-encoding: string
        script: | # javascript
          const { default: fn } = await import('${{ github.action_path }}/dist/post.js');
          return await fn(github);

    - name: Post the analysis comment
      if: ${{ steps.comment.outputs.relevant == 'true' }}
      uses: thoukydides/action-post-issue-comment@v1
      with:
        issue_number: ${{ inputs.issue_number }}
        body: ${{ steps.comment.outputs.result }}
        marker: '<!-- ai-triage-analysis -->'
        dry_run: ${{ inputs.dry_run }}